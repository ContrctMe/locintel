<!doctype html>
<!-- dark-first console: the .dark class IS the theme switch (ADR 20/47);
     a toggle removes it, no media query involved -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocIntel Console</title>
    <!-- installable on a phone (ADR 45): the ops "mobile answer" is the
         responsive console as a PWA - no offline service worker on purpose,
         an ops tool that silently serves stale data is worse than one that
         says it is offline -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#09090b" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
